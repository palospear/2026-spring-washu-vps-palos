<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Ching - The Grand Oracle Engine</title>
    <style>
        :root {
            --bg-paper: #F2EFE8; 
            --text-dark: #1A1A1A; 
            --cinnabar: #8A3B36; 
            --ink-mist: rgba(36, 52, 32, 0.08);
            --line-faded: rgba(26, 26, 26, 0.15);
            /* 主页的山脉色彩变量 */
            --m-1: #788A72; --m-2: #5B6E55; --m-3: #3F523A; --m-4: #243420; 
        }

        html, body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-paper); font-family: "Optima", "Cinzel", serif;
        }

        /* 噪点滤镜 */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 1000;
        }

        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 6vw; box-sizing: border-box; z-index: 1100;
        }
        .logo { font-family: "Noto Serif CJK TC", serif; font-size: 1.4rem; color: var(--text-dark); text-decoration: none; letter-spacing: 0.3em; }
        
        .nav-links a { text-decoration: none; color: #888; font-size: 0.75rem; letter-spacing: 0.2em; margin-left: 3rem; text-transform: uppercase; transition: 0.3s; white-space: nowrap; }
        .nav-links a.active-red { color: var(--cinnabar) !important; border: 1px solid rgba(138, 59, 54, 0.2); padding: 5px 15px; }

        .progress-ruler {
            position: fixed; left: 4vw; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 30px; z-index: 1000;
            transition: 0.8s opacity;
        }
        .step-node { width: 5px; height: 5px; border: 1px solid #AAA; border-radius: 50%; transition: 0.4s; }
        .step-node.active { background: var(--cinnabar); border-color: var(--cinnabar); transform: scale(1.6); }

        .canvas-area {
            position: relative; width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .background-hex {
            position: absolute; display: flex; flex-direction: column-reverse; gap: 2.5vh;
            transition: 1s cubic-bezier(0.2, 0.8, 0.2, 1); transform: scale(1.2); pointer-events: none;
            z-index: 10; 
        }
        /* 💡 彻底解决遮挡：进一步缩小卦象，并将其推得更高 */
        .background-hex.focused { transform: scale(0.7) translateY(-32vh); } 

        .bg-line { height: 2.5vh; width: 45vw; background: var(--line-faded); border-radius: 2px; position: relative; transition: background 1s; }
        .bg-line.dashed { background: transparent; }
        .bg-line.dashed::before, .bg-line.dashed::after { content: ""; position: absolute; height: 100%; width: 45%; background: var(--line-faded); transition: background 1s; }
        .bg-line.dashed::after { right: 0; }
        
        .background-hex.focused .bg-line { background: rgba(26, 26, 26, 0.25); }
        .background-hex.focused .bg-line.dashed { background: transparent; }
        .background-hex.focused .bg-line.dashed::before, .background-hex.focused .bg-line.dashed::after { background: rgba(26, 26, 26, 0.25); }

        @keyframes dotPop {
            0% { transform: translateY(-50%) scale(0); opacity: 0; }
            80% { transform: translateY(-50%) scale(1.4); opacity: 1; }
            100% { transform: translateY(-50%) scale(1); opacity: 0.9; }
        }
        .dot-mark { 
            position: absolute; right: -60px; top: 50%; 
            font-size: 3rem; color: var(--cinnabar); 
            animation: dotPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .interaction-overlay { position: relative; z-index: 20; text-align: center; transition: 0.8s opacity; }
        .coin-group { display: flex; gap: 4rem; margin-bottom: 4rem; perspective: 1200px; }
        .void-coin { width: 85px; height: 85px; position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .c-side { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.4); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #777; }
        .c-back { transform: rotateY(180deg); color: var(--cinnabar); border-color: rgba(138, 59, 54, 0.3); }

        .button-group { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1rem; }
        .ritual-btn { background: none; border: none; font-size: 0.85rem; letter-spacing: 0.5em; color: var(--text-dark); cursor: pointer; border-bottom: 1px solid #CCC; padding: 10px 20px; text-transform: uppercase; transition: 0.4s; }
        .ritual-btn:hover { color: var(--cinnabar); border-color: var(--cinnabar); letter-spacing: 0.7em; }
        .ritual-btn.quick { color: #888; font-size: 0.75rem; letter-spacing: 0.3em; border-color: transparent; opacity: 0.6; }
        .ritual-btn.quick:hover { opacity: 1; color: var(--text-dark); border-color: var(--text-dark); letter-spacing: 0.4em; }
        .ritual-btn:disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }

        .reveal-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; display: none; flex-direction: column; align-items: center;
            /* 💡 彻底解决遮挡：增加 top padding，让文字卡片被推得更靠下 */
            overflow-y: auto; padding: 48vh 20px 10vh; box-sizing: border-box;
        }
        
        .reveal-block {
            max-width: 650px; text-align: center; margin-bottom: 2.5rem;
            background: rgba(242, 239, 232, 0.65); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 3rem; border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03), inset 0 0 0 1px rgba(255,255,255,0.3);
            opacity: 0; transform: translateY(30px); transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-block.active { opacity: 1; transform: translateY(0); }

        .reveal-block h3 { font-size: 0.8rem; letter-spacing: 0.4em; color: #888; text-transform: uppercase; margin: 0 0 1rem; }
        .reveal-block h2 { font-size: 2.8rem; font-weight: 300; color: var(--cinnabar); margin: 0 0 1.5rem; line-height: 1.3; text-shadow: 0 2px 10px rgba(255,255,255,0.8); }
        .reveal-block p { font-family: "Baskerville", serif; font-size: 1.15rem; line-height: 1.8; color: #444; margin: 0; }

        .reset-btn { display: inline-block; margin-top: 1rem; color: #999; text-decoration: none; font-size: 0.8rem; letter-spacing: 0.2em; border-bottom: 1px solid #DDD; padding-bottom: 5px; transition: 0.3s; }
        .reset-btn:hover { color: var(--text-dark); border-color: var(--text-dark); }

        .echo-mountains {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 35vh;
            z-index: 1; pointer-events: none; opacity: 0.7; 
        }
        .echo-mountains svg {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
        }

        .mist-layer { position: fixed; bottom: -5%; width: 120%; height: 40vh; background: radial-gradient(ellipse at center, var(--ink-mist) 0%, transparent 70%); filter: blur(40px); pointer-events: none; z-index: 2; }
    </style>
</head>

        let step = 0;
        let cRotations = [0, 0, 0];
        let currentHexLines = []; 

        function disableButtons() {
            document.getElementById('ritualBtn').disabled = true;
            document.getElementById('quickBtn').disabled = true;
        }

        function enableButtons() {
            document.getElementById('ritualBtn').disabled = false;
            document.getElementById('quickBtn').disabled = false;
        }

        function tossProcess() {
            if (step >= 6) return;
            disableButtons();

            let heads = 0;
            for (let i = 1; i <= 3; i++) {
                const isHeads = Math.random() > 0.5;
                if (isHeads) heads++;
                cRotations[i-1] += (isHeads ? 1440 : 1620);
                document.getElementById('vc' + i).style.transform = `rotateY(${cRotations[i-1]}deg)`;
            }

            const score = (heads === 3) ? 9 : (heads === 0) ? 6 : (heads === 2) ? 8 : 7;
            currentHexLines.push(score);

            setTimeout(() => {
                appendLineToBackground(score);

                step++;
                if (step < 6) {
                    enableButtons();
                    updateStepUI();
                } else {
                    processFinalResult();
                }
            }, 1200);
        }

        function quickCast() {
            if (step >= 6) return;
            disableButtons();

            for (let i = 1; i <= 3; i++) {
                cRotations[i-1] += 2160; 
                document.getElementById('vc' + i).style.transform = `rotateY(${cRotations[i-1]}deg)`;
            }

            let rapidInterval = setInterval(() => {
                if (step >= 6) {
                    clearInterval(rapidInterval);
                    processFinalResult();
                    return;
                }

                let heads = 0;
                for (let i = 1; i <= 3; i++) {
                    if (Math.random() > 0.5) heads++;
                }

                const score = (heads === 3) ? 9 : (heads === 0) ? 6 : (heads === 2) ? 8 : 7;
                currentHexLines.push(score);
                appendLineToBackground(score);

                step++;
                updateStepUI();

            }, 250); 
        }

        function appendLineToBackground(score) {
            const isYang = (score === 7 || score === 9);
            const isDotted = (score === 6 || score === 9);
            
            const line = document.createElement('div');
            line.className = `bg-line ${isYang ? '' : 'dashed'}`;
            if(isDotted) {
                const dot = document.createElement('div');
                dot.className = 'dot-mark';
                dot.innerText = '•';
                line.appendChild(dot);
            }
            document.getElementById('bgHex').appendChild(line);
        }

        function updateStepUI() {
            const displayStep = Math.min(step, 6);
            if(displayStep < 6) {
                document.getElementById('stepNum').innerText = displayStep + 1;
            }
            const nodes = document.querySelectorAll('.step-node');
            nodes.forEach(n => n.classList.remove('active'));
            if(step < 6) {
                nodes[step].classList.add('active');
            } else {
                nodes[5].classList.add('active');
            }
        }

        function processFinalResult() {
            const presentBinary = currentHexLines.map(s => (s === 7 || s === 9) ? "1" : "0").join('');
            const futureBinary = currentHexLines.map(s => {
                if (s === 6) return "1"; 
                if (s === 9) return "0"; 
                return (s === 7) ? "1" : "0";
            }).join('');

            const hasChange = currentHexLines.some(s => s === 6 || s === 9);

            document.getElementById('uiCenter').style.opacity = '0';
            document.getElementById('progressRuler').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('uiCenter').style.display = 'none';
                document.getElementById('progressRuler').style.display = 'none';

                document.getElementById('bgHex').classList.add('focused');
                
                document.getElementById('revealContainer').style.display = 'flex';

                renderHex('present', presentBinary);
                if (hasChange) {
                    renderHex('future', futureBinary);
                    document.getElementById('futureBox').style.display = 'block';
                }
                
                setTimeout(() => {
                    document.getElementById('presentBox').classList.add('active');
                    if(hasChange) setTimeout(() => document.getElementById('futureBox').classList.add('active'), 400);
                }, 100);

            }, 800);
        }

        function renderHex(type, binary) {
            const data = hexData[binary];
            document.getElementById(type + 'Title').innerText = `Hexagram ${data.id}: ${data.title}`;
            document.getElementById(type + 'Desc').innerText = data.desc;
        }
    </script>
</body>
</html>
