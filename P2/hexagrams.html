<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Ching - 64 Hexagrams</title>
    <style>
        :root {
            --bg-paper: #F3EFE6; 
            --text-dark: #2A2A2A; 
        }

        body {
            background-color: var(--bg-paper); color: var(--text-dark);
            font-family: "Optima", "Baskerville", "Georgia", serif;
            margin: 0; height: 100vh; overflow: hidden; position: relative;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 50;
        }

        .top-nav { position: absolute; top: 6vh; left: 5vw; z-index: 60; }
        .top-nav a { text-decoration: none; color: var(--text-dark); font-size: 1.2rem; letter-spacing: 0.1em; }

        .card-container {
            position: absolute; top: 50%; left: 8vw; transform: translateY(-50%);
            width: 500px; max-height: 75vh; overflow-y: auto;
            border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 2.5rem 3rem;
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(15px);
            z-index: 10; display: flex; gap: 2.5rem; box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }

        .connector-line {
            position: absolute; top: 45px; right: -250px; width: 250px; height: 1px;
            transform-origin: left; transform: rotate(-12deg); z-index: 10;
            opacity: 0.6;
        }

        .big-hexagram { display: flex; flex-direction: column; gap: 8px; width: 90px; flex-shrink: 0; }
        .big-hexagram .line { height: 14px; width: 100%; border-radius: 2px; }
        
        .card-text { display: flex; flex-direction: column; gap: 1rem; }
        .card-title { font-size: 1.6rem; font-weight: normal; margin: 0; line-height: 1.4; white-space: pre-line; color: #111; }
        .card-desc { font-size: 1.1rem; line-height: 1.6; color: #444; margin: 0; }

        .wheel-container {
            position: absolute; top: 50%; right: 0; transform-origin: center center;
            width: 140vh; height: 140vh; margin-top: -70vh; margin-right: -35vh; 
            border-radius: 50%; z-index: 5; transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }

        .ring-line {
            position: absolute; top: 50%; left: 50%; border-radius: 50%;
            border: 1px dashed rgba(0, 0, 0, 0.04); transform: translate(-50%, -50%); pointer-events: none;
        }

        .wheel-item {
            position: absolute; top: 50%; left: 50%; width: 42px; height: 48px; 
            margin-top: -24px; margin-left: -21px; cursor: pointer;
            display: flex; flex-direction: column; gap: 3px; transition: all 0.3s ease; opacity: 0.6; 
        }
        
        .wheel-item::after {
            content: attr(data-id);
            position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
            font-size: 0.75rem; font-weight: bold; color: #999;
        }

        .wheel-item:hover { opacity: 1; transform: scale(1.2); }
        .wheel-item.active { opacity: 1; filter: drop-shadow(0 0 12px rgba(0,0,0,0.12)); z-index: 10;}

        .wheel-item .line, .big-hexagram .line { height: 4px; width: 100%; border-radius: 1px; }
        .wheel-item .dashed, .big-hexagram .dashed { display: flex; justify-content: space-between; }
        
        .wheel-item .solid, .wheel-item .dashed::before, .wheel-item .dashed::after,
        .big-hexagram .solid, .big-hexagram .dashed::before, .big-hexagram .dashed::after {
            border: 1px solid rgba(0,0,0,0.1); box-sizing: border-box;
        }

        .wheel-item .dashed::before, .wheel-item .dashed::after { content: ""; height: 100%; width: 42%; border-radius: 1px; }
        .big-hexagram .dashed::before, .big-hexagram .dashed::after { content: ""; height: 100%; width: 43%; border-radius: 2px; }

        .wheel-item .line:nth-child(-n+3).solid, .big-hexagram .line:nth-child(-n+3).solid { background-color: var(--color-upper); }
        .wheel-item .line:nth-child(-n+3).dashed::before, .wheel-item .line:nth-child(-n+3).dashed::after,
        .big-hexagram .line:nth-child(-n+3).dashed::before, .big-hexagram .line:nth-child(-n+3).dashed::after { background-color: var(--color-upper); }

        .wheel-item .line:nth-child(n+4).solid, .big-hexagram .line:nth-child(n+4).solid { background-color: var(--color-lower); }
        .wheel-item .line:nth-child(n+4).dashed::before, .wheel-item .line:nth-child(n+4).dashed::after,
        .big-hexagram .line:nth-child(n+4).dashed::before, .big-hexagram .line:nth-child(n+4).dashed::after { background-color: var(--color-lower); }

        @media (max-width: 1024px) {
            .card-container { width: 400px; left: 5vw; padding: 2rem; }
            .wheel-container { margin-right: -60vh; }
        }
    </style>
</head>
<body>

    <nav class="top-nav"><a href="index.html">&lt; Home</a></nav>

    <div class="card-container" id="readingCard">
        <div class="connector-line" id="connectorLine"></div>
        <div class="big-hexagram" id="cardHexagram"></div>
        <div class="card-text">
            <h1 class="card-title" id="cardTitle">Loading...</h1>
            <p class="card-desc" id="cardDesc"></p>
        </div>
    </div>

    <div class="wheel-container" id="wheel"></div>

    <script>
        const elementDict = {
            "Heaven":   { color: "#5B3A70", lines: [1,1,1] }, 
            "Lake":     { color: "#2C6B96", lines: [0,1,1] }, 
            "Fire":     { color: "#E27B32", lines: [1,0,1] }, 
            "Thunder":  { color: "#D4B12C", lines: [0,0,1] }, 
            "Wind":     { color: "#C11A41", lines: [1,1,0] }, 
            "Water":    { color: "#3F9E87", lines: [0,1,0] }, 
            "Mountain": { color: "#5AA83F", lines: [1,0,0] }, 
            "Earth":    { color: "#A41865", lines: [0,0,0] }  
        };

        const rawTextData = `
Hexagram 1: Heaven above Heaven below. Yielding.
The universe is united in power. So too the wise person execute his actions with power and creativity.
Hexagram 2: Earth above, Earth below. Yielding.
The receptive earth is in power. The wise person follows the natural path of calmness and correct persistence.
Hexagram 3: Water above, Thunder below. Confusion.
Thunderclouds indicate profound disquiet. Undertake no distant goal, but organize support.
Hexagram 4: Mountain above, Water below. Inexperience.
As spring water collects at the base of the quiet mountain, the enlightened person finds his level through learning.
Hexagram 5: Water above, Heaven below. Waiting.
Clouds of anxiety rise. Do not be anxious, but wait with confidence.
Hexagram 6: Heaven above, Water below. Conflict.
Heaven and water, strength and profundity, conflict. Avoid confrontation.
Hexagram 7: Earth above, Water below. Cooperation.
The receptive earth holds the water. and the wise person will find strength in the company of many fellows.
Hexagram 8: Water above, Earth below. Unity.
The receptive earth beneath. with profundity above, indicates the need for unity.
Hexagram 9: Wind above, Heaven below. Restraint.
The winds of gradual change. shows that restraint brings progress.
Hexagram 10: Heaven above, Lake below. Correct conduct. 
The excessive beneath the strong above. Discriminate between the inferior and superior.
Hexagram 11: Earth above, Heaven below. Prosperity.
The strength of Heaven mingles with the receptive earth. Good fortune approaches.
Hexagram 12: Heaven above, Earth below. Stagnation.
The strong and the receptive do not meet. The enlightened person remains reserved.
Hexagram 13: Heaven above, Fire below. Community.
Strength of heaven, dependence of fire. Recognize the dependence of all upon their fellows.
Hexagram 14: Fire above, Heaven below. Sovereignty.
The strength of heaven holds a fiery intelligence. Resist evil; exalt good.
Hexagram 15: Earth above, Mountain below. Moderation.
The tranquil mountain amid the receptive earth. Progress comes by equality of extremes.
Hexagram 16: Thunder above, Earth below. Harmony. 
From the receptive earth comes the loud thunder. Harmony brings advantage.
Hexagram 17: Lake above, Thunder below. Flexibility.
In the midst of excess, growth and persistence. The enlightened person adapts.
Hexagram 18: Mountain above, Wind below. Repair.
Winds of gradual change wear away the mountain. Cultivate action in others to bring about repair.
Hexagram 19: Earth above, Lake below. Promotion.
The earth above reflects in the lake beneath. The enlightened person is willing to teach and learn.
Hexagram 20: Wind above, Earth below. Contemplation.
As the wind moves over the earth. visited its regions and contemplated its many cultures.
Hexagram 21: Fire above, Thunder below. Reform.
The turbulence of thunder and lightning indicates the need for change. Administer justice.
Hexagram 22: Mountain above, Fire below. Serenity.
Illumination reveals the foot of the immovable mountain. perceives and avoids disputes.
Hexagram 23: Mountain above, Earth below. Deterioration.
The weak earth cannot support the mountain. stabilize their lives through generosity.
Hexagram 24: Earth above, Thunder below. Repetition.
The beginning of a new cycle. Friends return. The repeating cycle is part of the Way.
Hexagram 25: Heaven above, Thunder below. Spontaneity.
Strength above and activity below. Act with persistence and inspiration.
Hexagram 26: Mountain above, Heaven below. Potential.
The strength of the Heavens comes from within the mountain. studies the past's wisdom.
Hexagram 27: Mountain above, Thunder below. Nurturing.
Energy stirs beneath immobility. but be cautious in expression and avoid the negative.
Hexagram 28: Lake above, Wind below. Imminent change.
The enlightened person withdraws from the world. Stress is imminent.
Hexagram 29: Water above, Water below. Danger.
Profundity produces difficulty. The wise person learns confidence through danger.
Hexagram 30: Fire above, Fire below. Enlightened intelligence. 
The enlightened person cultivates intelligence and gains progress through correct persistence.
Hexagram 31: Lake above, Mountain below. Attraction.
Tranquility combined with excess produces pleasure. Accept others and act openly.
Hexagram 32: Thunder above, Wind below. Continuity.
Activity and change teach well the value of endurance. Stand firm and move with persistence.
Hexagram 33: Heaven above, Mountain below. Retreat.
The tranquil mountain remains quiet under Heaven's gaze. maintain dignity in retreat.
Hexagram 34: Thunder above, Heaven below. Power.
Activity in the light of day. Use influence wisely.
Hexagram 35: Fire above, Earth below. Progress.
The sun rises above the earth. Reveal virtue. Help others through cleverness and virtue.
Hexagram 36: Fire above, Earth below. Subtlety.
Intelligence is hidden within the earth. Conceal goals, but do not abandon them.
Hexagram 37: Wind above, Fire below. Family.
Winds of change issue from intelligent action. Faith and loyalty must be nurtured.
Hexagram 38: Fire above, Lake below. Contradiction.
Intelligence contradicts excess. Maintain individuality.
Hexagram 39: Water above, Mountain below. Obstacles.
Profound movement meets immobility. perfects his own behavior to gain strength.
Hexagram 40: Thunder above, Water below. Liberation.
Rain and thunder indicate profound activity. find good fortune in quick action.
Hexagram 41: Mountain above, lake below. Decline.
Excess is held by immobility. Avoid anger, develop confidence.
Hexagram 42: Wind above, Thunder below, Benefit.
An enlightened person sees the good actions of his fellows. Imitate them and correct mistakes.
Hexagram 43: Lake above, Heaven below. Resolve.
Excess drawn into Heaven's gaze produces honesty. Do not use force.
Hexagram 44: Heaven above, Wind below. Temptation.
Heaven's power makes stronger the wind of change. Exert discipline.
Hexagram 45: Lake above, Earth below. Assembly.
The earth receives excess. Unite with others, act with sincerity and avoid suspicion.
Hexagram 46: Earth above, Wind below. Advancement.
Gradual change nourished by the receptive earth. Approach leaders without fear.
Hexagram 47: Lake above, Water below. Adversity.
Excess lacks profundity. Ad-versity needs risks to achieve fortune.
Hexagram 48: Water above, Wind below. Insight.
Profound penetration and change. Truth is never exhausted.
Hexagram 49: Lake above, Fire below. Change.
Intelligent consciousness amid excess produces change. confidence only after change is past.
Hexagram 50: Fire above, Wind below. Order. 
Intelligence combined with penetration makes progress. Aligns with the established order.
Hexagram 51: Thunder above, Thunder below. Shock.
Repeated activity produces sudden surprise. take advantage of the unpredictable.
Hexagram 52: Mountain above, Mountain below. Meditation. 
Tranquility upon tranquility. turns his back upon the larger situation and loses self awareness.
Hexagram 53: Wind above, Mountain below. Development. 
Penetrating change moves the immobile mountain. improves life through good conduct.
Hexagram 54: Thunder above, Lake below. Passivity.
Action above, excess below. takes no action but considers the near future.
Hexagram 55: Thunder above, Fire below. Peaking intelligence.
Intelligence combined with activity. Do not fear decline, but shine like the sun.
Hexagram 56: Fire above, Mountain below. Travel.
Illumination upon the quiet mountain. The wise person is clear-minded.
Hexagram 57: Wind above, Wind below. Influence.
Penetrating change above and below. Wait and consider larger perspectives.
Hexagram 58: Lake above, Lake below. Encouragement. 
Openness and excess above and below. Exchange ideas with others to find cooperation.
Hexagram 59: Wind above, Water below. Reunion.
Gradual change above the profound water. Rulers meet with their subordinates.
Hexagram 60: Lake below, Water above. Limitation. 
Profundity is held in check by excess. decides proper conduct.
Hexagram 61: Wind above, Lake below. Understanding. 
Penetrating change above the open lake. Moderate disputes. must avoid rigidity.
Hexagram 62: Thunder above, Mountain below, Attention to detail.
The mountain remains tranquil in activity. Be remorseful in losses and frugal in expenses.
Hexagram 63: Water above, Fire below. Precaution.
In consciousness is bred profound difficulty. defends against forthcoming adversity.
Hexagram 64: Fire above, Water below. Vigilance.
Consciousness above the difficult water. Progress with great vigilance.
`;

        const hexagramData = [];
        const blocks = rawTextData.trim().split(/(?=Hexagram \d+:)/);

        blocks.forEach(block => {
            const lines = block.trim().split('\n');
            const header = lines[0];
            const desc = lines.slice(1).join(' ');

            const idMatch = header.match(/Hexagram (\d+):/);
            const trigramMatch = header.match(/(\w+) above,? (\w+) below/i) || header.match(/(\w+) above (\w+) below/i);

            if (idMatch && trigramMatch) {
                const topStr = trigramMatch[1];
                const bottomStr = trigramMatch[2];
                const topTrigram = elementDict[topStr] || elementDict["Earth"];
                const bottomTrigram = elementDict[bottomStr] || elementDict["Earth"];

                hexagramData.push({
                    id: parseInt(idMatch[1]),
                    lines: [...topTrigram.lines, ...bottomTrigram.lines],
                    upperColor: topTrigram.color,
                    lowerColor: bottomTrigram.color,
                    title: header.replace(/Hexagram \d+:/, `Hexagram ${idMatch[1]}:\n`),
                    desc: desc
                });
            }
        });

        const wheel = document.getElementById('wheel');
        const cardTitle = document.getElementById('cardTitle');
        const cardDesc = document.getElementById('cardDesc');
        const cardHexagram = document.getElementById('cardHexagram');
        const connectorLine = document.getElementById('connectorLine');

        const ringsConfig = [
            { count: 8, radiusVH: 15 },
            { count: 12, radiusVH: 28 },
            { count: 20, radiusVH: 43 },
            { count: 24, radiusVH: 58 }
        ];

        let itemIdx = 0;
        ringsConfig.forEach(ring => {
            const ringLine = document.createElement('div');
            ringLine.className = 'ring-line';
            ringLine.style.width = `${ring.radiusVH * 2}vh`;
            ringLine.style.height = `${ring.radiusVH * 2}vh`;
            wheel.appendChild(ringLine);

            for (let i = 0; i < ring.count; i++) {
                if (itemIdx >= hexagramData.length) break;
                const data = hexagramData[itemIdx];
                const angle = (360 / ring.count) * i;
                
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.setAttribute('data-id', data.id);
                item.style.setProperty('--color-upper', data.upperColor);
                item.style.setProperty('--color-lower', data.lowerColor);
                
                const pxRadius = (window.innerHeight * ring.radiusVH) / 100;
                item.style.transform = `rotate(${angle}deg) translateY(-${pxRadius}px)`;
                item.innerHTML = data.lines.map(s => `<div class="line ${s ? 'solid' : 'dashed'}"></div>`).join('');
                
                item.dataset.angle = angle;
                item.onclick = () => activate(item, data);
                wheel.appendChild(item);
                itemIdx++;
            }
        });

        function activate(el, data) {
            document.querySelectorAll('.wheel-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            wheel.style.transform = `rotate(${-102 - parseFloat(el.dataset.angle)}deg)`;
            
            cardTitle.innerText = data.title;
            cardDesc.innerText = data.desc;
            cardHexagram.innerHTML = data.lines.map(s => `<div class="line ${s ? 'solid' : 'dashed'}"></div>`).join('');
            cardHexagram.style.setProperty('--color-upper', data.upperColor);
            cardHexagram.style.setProperty('--color-lower', data.lowerColor);
            
            connectorLine.style.background = `linear-gradient(to right, ${data.lowerColor}, ${data.upperColor})`;
            
            const card = document.getElementById('readingCard');
            card.style.opacity = 0;
            setTimeout(() => card.style.opacity = 1, 100);
        }

        setTimeout(() => {
            const first = document.querySelector('.wheel-item[data-id="1"]');
            if (first) first.click();
        }, 300);

    </script>
</body>
</html>
